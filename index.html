 future:["Couple Celebrates Another Beautiful Year Together.","Boyfriend Still Holds the Title of Favourite Person.","Breaking: The Love Story Continues.","Exclusive: More Memories Expected in the Years Ahead."],
 ending:"THIS WAS ONLY OUR FIRST EDITION.\nTHERE ARE SO MANY MORE CHAPTERS LEFT TO WRITE.",

};

let AC,muted=false,last=-1;const BUF=[];
try{AC=new(window.AudioContext||window.webkitAudioContext)();
 SND.forEach(u=>{const b=atob(u.split(",")[1]),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);
  const ok=x=>BUF.push(x);const p=AC.decodeAudioData(a.buffer,ok,()=>{});if(p&&p.catch)p.catch(()=>{})})}catch(e){}
function sfx(t0){if(muted||!AC||!BUF.length)return;try{if(AC.state==="suspended")AC.resume();
 let k;do{k=Math.floor(Math.random()*BUF.length)}while(k===last&&BUF.length>1);last=k;
 const s=AC.createBufferSource(),g=AC.createGain();s.buffer=BUF[k];s.playbackRate.value=.95+Math.random()*.1;g.gain.value=1;
 s.connect(g);g.connect(AC.destination);s.start(AC.currentTime+t0)}catch(e){}}
$("#mute").onclick=function(){muted=!muted;this.textContent=muted?"🔇":"🔊";this.setAttribute("aria-pressed",muted);this.setAttribute("aria-label",muted?"Turn page sound on":"Turn page sound off")};
function go(n){document.querySelectorAll("video").forEach(v=>v.pause());const to=Math.max(0,Math.min(N-1,n)),idx=L.map((_,i)=>i).filter(i=>(i<to)!==L[i].classList.contains("gone"));
 if(to<cur)idx.reverse();
 idx.forEach((i,k)=>{const l=L[i],d=k*.16;l.style.setProperty("--d",d+"s");l.classList.toggle("gone",i<to);l.classList.add("flip");setTimeout(()=>l.classList.remove("flip"),(1.3+d)*1000);if(to!==N-1&&cur!==N-1)sfx(d)});
 cur=to;L.forEach((l,i)=>l.inert=i!==cur);
 $("#lab").textContent=`Page ${cur+1} of ${N}${cur?"":" · tap the sides to turn pages"}`;
 $("#lt").classList.remove("open","read");}
document.addEventListener("click",e=>{const b=e.target.closest("[data-n]");if(b)go(+b.dataset.n)});
document.addEventListener("click",e=>{if(e.target.closest("button,a,.paper,video"))return;go(cur+(e.clientX>innerWidth/2?1:-1))});
addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(cur+1);if(e.key==="ArrowLeft")go(cur-1)});
let sx,sy;addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
addEventListener("touchend",e=>{if(e.target.closest&&e.target.closest("video"))return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5)go(cur+(dx<0?1:-1))});
$("#openL").onclick=()=>{$("#lt").classList.add("open");setTimeout(()=>$("#lt").classList.add("read"),500)};
$("#closeL").onclick=()=>$("#lt").classList.remove("open","read");
function fit(){const aw=innerWidth-40,ah=innerHeight-48,sc=Math.min(aw/360,ah/736,1.6),st=$("#stage");
 $("#fit").style.cssText=`width:${360*sc}px;height:${ah}px`;st.style.height=ah/sc+"px";st.style.setProperty("--h",ah/sc+"px");st.style.transform=`scale(${sc})`}
addEventListener("resize",fit);fit();go(0);
</script></body></html>
